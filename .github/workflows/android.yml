name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload HoloOS APK
        uses: actions/upload-artifact@v4
        with:
          name: HoloOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload HoloBridge APK
        uses: actions/upload-artifact@v4
        with:
          name: HoloBridge-debug-apk
          path: holobridge/build/outputs/apk/debug/holobridge-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build HoloBridge for Windows 10 x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish HoloBridge PC
        run: dotnet publish HoloBridgePC/HoloBridgePC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/HoloBridgePC
      - name: Upload HoloBridge Windows app
        uses: actions/upload-artifact@v4
        with:
          name: HoloBridge-Windows-x64
          path: publish/HoloBridgePC/
          if-no-files-found: error
          retention-days: 14
